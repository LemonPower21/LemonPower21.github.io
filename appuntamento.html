<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pianifichiamo il Date 📅</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      max-width: 450px;
      width: 100%;
    }
    h2 { color: #30336b; text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; color: #555; font-weight: 600; }
    input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
    }
    input:focus, select:focus { border-color: #6c5ce7; }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #6c5ce7;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Scegli il nostro Appuntamento ✨</h2>
    <form id="dateForm">
      <div class="form-group">
        <label for="data">Che giorno libero hai?</label>
        <input type="date" id="data" required>
      </div>

      <div class="form-group">
        <label for="attivita">Cosa ti andrebbe di fare?</label>
        <select id="attivita" required>
          <option value="Cena Romantica 🍕">Cena Romantica 🍕</option>
          <option value="Aperitivo al tramonto 🍹">Aperitivo al tramonto 🍹</option>
          <option value="Cinema + Popcorn 🍿">Cinema + Popcorn 🍿</option>
          <option value="Passeggiata + Gelato 🍦">Passeggiata + Gelato 🍦</option>
          <option value="Serata Netflix & Relax 🎬">Serata Netflix & Relax 🎬</option>
        </select>
      </div>

      <div class="form-group">
        <label for="cibo">Cosa mangiamo?</label>
        <select id="cibo" required>
          <option value="Pizza 🍕">Pizza 🍕</option>
          <option value="Sushi 🍣">Sushi 🍣</option>
          <option value="Hamburger 🍔">Hamburger 🍔</option>
          <option value="Messicano 🌮">Messicano 🌮</option>
          <option value="Dolce e Caffè 🍰">Dolce e Caffè 🍰</option>
        </select>
      </div>

      <div class="form-group">
        <label for="ora">A che ora ci vediamo?</label>
        <input type="time" id="ora" required>
      </div>

      <button type="submit" class="btn-submit">Conferma le scelte 💌</button>
    </form>
  </div>

  <script>
    document.getElementById('dateForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Salva i dati inseriti nel localStorage del browser
      const dateDetails = {
        data: document.getElementById('data').value,
        attivita: document.getElementById('attivita').value,
        cibo: document.getElementById('cibo').value,
        ora: document.getElementById('ora').value
      };

      localStorage.setItem('dateDetails', JSON.stringify(dateDetails));
      window.location.href = 'conferma.html';
    });
  </script>
</body>
</html>
