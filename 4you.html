<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ho una domanda per te... 💖</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 90%;
      position: relative;
    }
    h1 { color: #d63384; font-size: 2rem; margin-bottom: 15px; }
    p { color: #555; font-size: 1.1rem; margin-bottom: 30px; }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      min-height: 50px;
      position: relative;
    }
    .btn {
      padding: 12px 28px;
      font-size: 1.1rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s;
      text-decoration: none;
    }
    .btn-yes { background-color: #ff4757; color: white; box-shadow: 0 5px 15px rgba(255,71,87,0.4); }
    .btn-yes:hover { transform: scale(1.08); }
    .btn-no { background-color: #e0e0e0; color: #333; position: absolute; right: 20px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Vuoi uscire con me? 🌹</h1>
    <p>Prometto cibo buono, risate e zero noia!</p>
    
    <div class="buttons">
      <a href="appuntamento.html" class="btn btn-yes">Sì! 🥰</a>
      <button class="btn btn-no" id="noBtn">No 😜</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');

    // Il bottone "No" scappa quando ci si passa sopra col mouse o lo si tocca
    function moveButton() {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40);
      noBtn.style.position = 'fixed';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    }

    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('touchstart', moveButton);
  </script>
</body>
</html>
