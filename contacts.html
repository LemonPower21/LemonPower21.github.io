<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7043033351033202" crossorigin="anonymous"></script>
    <title>Contacts - LemonPower21</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-blue': 'hwb(243 6% 42%)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: hwb(243 6% 42%);
            color: white;
            padding: 1em 0;
            font-weight: bold;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: #ffd700;
            text-decoration: underline;
        }

        main {
            padding: 40px 20px;
            max-width: 960px;
            margin: 20px auto;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h2.section-title {
            color: hwb(243 6% 42%);
            margin-bottom: 30px;
            text-align: center;
            font-weight: bold;
            font-size: 2.2em;
        }

        .social-logos {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
        }

        .social-logos a {
            display: block;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .social-logos a:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.25);
        }

        .social-logos img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: hwb(243 6% 42%);
            color: white;
            font-weight: bold;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        /* Gestione spazio footer */
        body { padding-bottom: 70px; }

        @media (max-width: 768px) {
            .social-logos { gap: 20px; }
            .social-logos a { width: 60px; height: 60px; }
            h2.section-title { font-size: 1.8em; }
            footer { position: relative; }
            body { padding-bottom: 0; }
        }
    </style>
</head>
<body>

    <header>
        <nav class="container mx-auto px-4 flex flex-wrap justify-between items-center">
            <div class="text-xl">LemonPower21</div>

            <button id="hamburger" class="md:hidden block focus:outline-none">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                </svg>
            </button>

            <ul id="nav-links" class="hidden md:flex flex-row space-x-5 w-full md:w-auto mt-4 md:mt-0 text-center">
                <li><a href="index.html">Home</a></li>
                <li><a href="career.html">Career</a></li>
                <li><a href="youtube.html">YouTube</a></li>
                <li><a href="aboutme.html">About Me</a></li>
                <li><a href="contacts.html">Contacts</a></li>
                <li><a href="affiliation.html">Affiliations</a></li>
                <li class="py-2 md:py-0"><a href="https://lemonpfit.blogspot.com/" target="_blank">FitBlog</a></li>
                <li><a href="https://lemonptech.blogspot.com/" target="_blank">TechBlog</a></li>
                <li><a href="https://lemonpower21.substack.com/" target="_blank">Substack</a></li>
                <li><a href="https://ko-fi.com/lemonpower21" target="_blank">Donations</a></li>
                <li><a href="https://lemonpstore.gumroad.com/" target="_blank">Store</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 class="section-title">Get in Touch</h2>
        <div class="social-logos">
            <a href="https://www.linkedin.com/in/francesco-vito-giotta-969938314/" target="_blank" aria-label="LinkedIn">
                <img src="images/1.png" alt="LinkedIn" onerror="this.src='https://placehold.co/70x70?text=In'">
            </a>
            <a href="https://github.com/LemonPower21/LemonPower21" target="_blank" aria-label="GitHub">
                <img src="images/3.png" alt="GitHub" onerror="this.src='https://placehold.co/70x70?text=Git'">
            </a>
            <a href="https://www.youtube.com/@LemonPower21" target="_blank" aria-label="YouTube">
                <img src="images/4.png" alt="YouTube" onerror="this.src='https://placehold.co/70x70?text=YT'">
            </a>
            <a href="https://www.instagram.com/lemon_power21/" target="_blank" aria-label="Instagram">
                <img src="images/2.png" alt="Instagram" onerror="this.src='https://placehold.co/70x70?text=IG'">
            </a>
            <a href="mailto:giotta.francescovitosp@gmail.com" aria-label="Email">
                <img src="images/5.png" alt="Email" onerror="this.src='https://placehold.co/70x70?text=@'">
            </a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 LemonPower21. All rights reserved.</p>
    </footer>

    <script>
        const btn = document.getElementById('hamburger');
        const menu = document.getElementById('nav-links');

        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
            menu.classList.toggle('flex-col');
        });
    </script>
</body>
</html>
