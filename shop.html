<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-blue': 'hwb(243 6% 42%)', // Color of your header
                        'accent-yellow': '#ffd700', // Hover color for navigation
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'], // Inter font
                    }
                }
            }
        }
    </script>
    <style>
        /* Base styles */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: hwb(243 6% 42%);
            color: white;
            padding: 1em 0;
            text-align: center;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        nav ul li {
            display: inline; /* Keep navigation items inline */
            margin: 0 15px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: #ffd700;
            text-decoration: underline;
        }

        main {
            padding: 20px;
            max-width: 960px;
            margin: 20px auto;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: hwb(243 6% 42%);
            color: white;
            position: relative;
            bottom: 0;
            width: 100%;
            font-weight: bold;
        }

        /* Specific styles for article sections, adapted from aboutme.html's content-section */
        .article-section {
            display: flex;
            align-items: flex-start;
            margin-bottom: 30px;
            gap: 20px; /* Consistent gap */
            padding: 15px; /* Consistent padding */
            border-bottom: 1px solid #eee;
            border-radius: 8px; /* Added for consistency */
            transition: transform 0.3s ease, box-shadow 0.3s ease; /* Hover effects */
        }

        .article-section:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
        }

        .article-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .article-section.reverse {
            flex-direction: row-reverse;
        }

        .article-section img {
            width: 40%;
            max-width: 350px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            object-fit: cover; /* Ensures image covers the container without distortion */
        }

        .article-section .text-content {
            flex: 1;
            font-size: 1.05em;
            line-height: 1.6;
        }

        h2.section-title {
            color: hwb(243 6% 42%);
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
            font-weight: bold;
            font-size: 2em; /* Kept current size as it looks good for a main title */
        }

        h3.subsection-title { /* Renamed for consistency with aboutme.html */
            color: hwb(243 6% 42%);
            margin-top: 0;
            margin-bottom: 10px; /* Consistent margin */
            font-size: 1.5em; /* Consistent size */
            font-weight: bold; /* Consistent font-weight */
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 768px) {
            /* Kept these responsive rules, but specifically removed the stacking of nav ul li below 480px */
            .article-section {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            .article-section.reverse {
                flex-direction: column;
            }
            .article-section img {
                width: 80%;
                margin-bottom: 20px; /* Consistent margin */
            }
            .article-section .text-content {
                text-align: center;
            }
            header {
                font-size: 1.1em;
            }
            nav ul li a {
                font-size: 1em;
                margin: 0 8px;
            }
            h2.section-title {
                font-size: 1.7em;
            }
            h3.subsection-title { /* Consistent naming */
                font-size: 1.4em;
            }
            main {
                padding: 15px;
                margin: 15px auto;
            }
        }
        /* Removed the @media (max-width: 480px) rule that set nav ul li to display: block;
            This ensures the navigation stays horizontal on all screen sizes. */
    </style>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="career.html">Career</a></li>
                <li><a href="youtube.html">YouTube</a></li>
                <li><a href="aboutme.html">About Me</a></li>
                <li><a href="contacts.html">Contacts</a></li>
                <li><a href="affiliation.html">Affiliation</a></li>
                <li><a href="shop.html">Shop</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 class="section-title">Available soon...</h2>
        <p style="text-align: center; margin-bottom: 40px; font-size: 1.1em;">The shop will be available soon.</p>
    </main>

    <footer>
        <p>&copy; 2025 LemonPower21. All rights reserved.</p>
    </footer>

</body>
</html>
