<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Dashboard - Essential Edition</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f172a;
            color: white;
            margin: 0;
        }
        .card {
            text-align: center;
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            max-width: 400px;
            width: 90%;
        }
        h1 { margin-bottom: 10px; font-size: 1.5rem; color: #38bdf8; }
        p { color: #94a3b8; margin-bottom: 30px; line-height: 1.5; font-size: 0.9rem; }
        
        .launch-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .launch-btn:hover {
            background: #7dd3fc;
            transform: scale(1.02);
        }

        .status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #fb7185;
            font-style: italic;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Social Launcher Pro</h1>
    <p>Apertura sequenziale di 4 piattaforme.<br>Intervallo: 1.5 secondi.</p>
    
    <button class="launch-btn" onclick="openAll()">Avvia Sequenza</button>
    
    <div id="status-msg" class="status"></div>
</div>

<script>
    function openAll() {
        const links = [
            "https://www.youtube.com/@LemonPower21",
            "https://www.instagram.com/",
            "https://www.tiktok.com/",
            "https://www.linkedin.com/",
            "https://substack.com/"
        ];

        const msgDiv = document.getElementById('status-msg');
        msgDiv.style.color = "#fb7185";
        msgDiv.innerText = "Sequenza avviata...";

        links.forEach((url, index) => {
            setTimeout(() => {
                window.open(url, '_blank');
                
                // Aggiorna il progresso nel messaggio di stato
                msgDiv.innerText = `Apertura link ${index + 1} di ${links.length}...`;
                
                if (index === links.length - 1) {
                    msgDiv.style.color = "#4ade80";
                    msgDiv.innerText = "Completato! Tutti i 6 link aperti.";
                }
            }, index * 1500); // 1.5 secondi di delay
        });
    }
</script>

</body>
</html>
